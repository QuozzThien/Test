<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#070a18">

  <title>Luyện Thi</title>

  <link rel="stylesheet" href="../main.css?v=20">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>

<body>

  <div id="app">
    <div class="wrap">
      <section class="card">
        <h2>Đang tải Luyện Thi...</h2>
        <p class="muted">Vui lòng chờ.</p>
      </section>
    </div>
  </div>

  <script src="../config.js?v=20"></script>
  <script src="../app.js?v=20"></script>
  <script src="../ai.js?v=20"></script>

  <script>
    window.addEventListener("error", function(e) {
      const app = document.getElementById("app");
      app.innerHTML = `
        <div class="wrap">
          <section class="card">
            <h2>Lỗi tải trang</h2>
            <p class="muted">${e.message || "Không xác định"}</p>
            <button class="btn primary" onclick="location.reload()">
              TẢI LẠI
            </button>
          </section>
        </div>
      `;
    });
  </script>

</body>
</html>
